<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Bio Market</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="index.html" class="logo"><span class="leaf">🌿</span> Bio Market</a>
      <div class="nav-links">
        <a href="products.html">Catalogue</a>
        <a href="login.html">Connexion</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="auth-box">
      <h2>Créer un compte</h2>
      <p class="subtitle">Rejoignez Bio Market en quelques secondes</p>

      <div class="tabs">
        <button class="active" id="tab-buyer" onclick="switchRole('buyer')">🛍️ Acheteur</button>
        <button id="tab-seller" onclick="switchRole('seller')">🏪 Vendeur</button>
      </div>

      <div class="field"><label>Nom complet</label><input type="text" id="name" placeholder="Votre nom"></div>
      <div class="field"><label>Adresse email</label><input type="email" id="email" placeholder="vous@exemple.com"></div>
      <div class="field" id="shop-field" style="display:none;"><label>Nom de la boutique</label><input type="text" id="shop" placeholder="Ma boutique bio"></div>

      <div class="field"><label>Mot de passe</label><input type="password" id="password" placeholder="8+ caractères"></div>
      <div class="field"><label>Confirmer le mot de passe</label><input type="password" id="password2" placeholder="••••••••"></div>

      <div style="font-size:13px;color:#607d8b;margin-bottom:16px;">
        <label><input type="checkbox" id="terms"> J'accepte les conditions d'utilisation et la politique de confidentialité</label>
      </div>

      <button class="btn btn-primary btn-block" onclick="doRegister()">Créer mon compte</button>

      <p style="text-align:center;font-size:14px;margin-top:18px;">
        Déjà inscrit ? <a href="login.html" style="color:#2e7d32;font-weight:600;">Se connecter</a>
      </p>
    </div>
  </main>

  <script>
    let role = 'buyer';
    function switchRole(r) {
      role = r;
      document.getElementById('tab-buyer').classList.toggle('active', r === 'buyer');
      document.getElementById('tab-seller').classList.toggle('active', r === 'seller');
      document.getElementById('shop-field').style.display = r === 'seller' ? 'block' : 'none';
    }

    function doRegister() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      const terms = document.getElementById('terms').checked;

      if (!name || !email || !p1 || !p2) { alert('❌ Veuillez remplir tous les champs'); return; }
      if (p1.length < 8) { alert('❌ Le mot de passe doit contenir au moins 8 caractères'); return; }
      if (p1 !== p2) { alert('❌ Les mots de passe ne correspondent pas'); return; }
      if (!terms) { alert('❌ Vous devez accepter les conditions'); return; }

      alert('✅ Démo : compte ' + role + ' créé (' + email + '). Aucune donnée réelle enregistrée.');
      location.href = role === 'seller' ? 'vendor-dashboard.html' : 'index.html';
    }
  </script>
</body>
</html>
