<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon panier — Bio Market</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="index.html" class="logo"><span class="leaf">🌿</span> Bio Market</a>
      <form class="search" onsubmit="return false;">
        <input type="text" placeholder="Rechercher un produit bio..." id="search-input">
        <button onclick="location.href='products.html?q='+encodeURIComponent(document.getElementById('search-input').value)">🔍</button>
      </form>
      <div class="nav-links">
        <a href="products.html">Catalogue</a>
        <a href="login.html">Connexion</a>
        <a href="register.html" class="btn btn-primary btn-sm">S'inscrire</a>
        <a href="cart.html" title="Panier">🛒</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="breadcrumb"><a href="index.html">Accueil</a> / Panier</div>
    <h1 class="section-title">Mon panier <span class="link" href="products.html" onclick="location.href='products.html'" style="cursor:pointer">Continuer mes achats →</span></h1>

    <div id="cart-content"></div>
  </main>

  <footer class="footer">
    <div class="cols">
      <div><h4>🌿 Bio Market</h4><a href="#">À propos</a><a href="#">Produits</a><a href="#">Vendeurs</a></div>
      <div><h4>Aide</h4><a href="#">Nous contacter</a><a href="#">Livraison</a><a href="#">Retours</a></div>
      <div><h4>Compte</h4><a href="login.html">Connexion</a><a href="register.html">Inscription</a><a href="cart.html">Panier</a></div>
    </div>
    <div class="copy">© 2026 Bio Market — Prototype de démonstration</div>
  </footer>

  <script src="products-data.js"></script>
  <script>
    function render() {
      const cart = JSON.parse(localStorage.getItem('biomarket_cart') || '[]');
      const box = document.getElementById('cart-content');

      if (cart.length === 0) {
        box.innerHTML = `<div class="empty">
          <div class="icon">🛒</div>
          <h3>Votre panier est vide</h3>
          <p>Parcourez le catalogue et ajoutez des produits bio !</p>
          <a href="products.html" class="btn btn-primary" style="margin-top:16px;display:inline-block;">Voir le catalogue</a>
        </div>`;
        return;
      }

      const items = cart.map(i => {
        const p = PRODUCTS.find(x => x.id === i.id);
        if (!p) return null;
        return `<div class="cart-item">
          <div class="thumb">${p.emoji}</div>
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="sub">Par ${p.seller} · ${p.price.toFixed(2)} € ${p.unit}</div>
            <div class="qty" style="margin-top:8px;">
              <button onclick="changeQty(${p.id}, -1)">−</button>
              <span class="value">${i.qty}</span>
              <button onclick="changeQty(${p.id}, 1)">+</button>
            </div>
          </div>
          <div class="line-price">${(p.price * i.qty).toFixed(2)} €</div>
          <button class="btn btn-ghost btn-sm" onclick="removeItem(${p.id})">🗑️</button>
        </div>`;
      }).filter(Boolean).join('');

      const subtotal = cart.reduce((s, i) => {
        const p = PRODUCTS.find(x => x.id === i.id);
        return p ? s + p.price * i.qty : s;
      }, 0);
      const shipping = subtotal >= 30 ? 0 : 4.90;
      const total = subtotal + shipping;

      box.innerHTML = `<div class="cart-layout">
        <div class="cart-items">${items}</div>
        <div class="summary">
          <h3>Récapitulatif</h3>
          <div class="row"><span>Sous-total</span><span>${subtotal.toFixed(2)} €</span></div>
          <div class="row"><span>Livraison</span><span>${shipping === 0 ? '<span class="badge badge-green">Gratuite</span>' : shipping.toFixed(2) + ' €'}</span></div>
          <div class="row total"><span>Total</span><span>${total.toFixed(2)} €</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;">Passer commande →</a>
          <a href="products.html" class="btn btn-ghost btn-block" style="margin-top:8px;">Continuer mes achats</a>
        </div>
      </div>`;
    }

    function changeQty(id, d) {
      let cart = JSON.parse(localStorage.getItem('biomarket_cart') || '[]');
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += d;
        if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      }
      localStorage.setItem('biomarket_cart', JSON.stringify(cart));
      render();
    }

    function removeItem(id) {
      let cart = JSON.parse(localStorage.getItem('biomarket_cart') || '[]').filter(i => i.id !== id);
      localStorage.setItem('biomarket_cart', JSON.stringify(cart));
      render();
    }

    render();
  </script>
</body>
</html>
